name: Build debug APK

# Builds an installable, debug-signed APK without any of the release or Telegram secrets that
# build.yml needs, and uploads it as a workflow artifact named "duckdetector-debug-apk".
on:
  push:
    branches:
      - claude/new-session-6n6q8z
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  assemble-debug:
    name: Assemble debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false

      - name: Set up Android build toolchain
        uses: ./.github/actions/setup-android-build
        with:
          cache-read-only: "false"

      - name: Generate contributors JSON and avatars
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./gradlew --stacktrace -Pduckdetector.githubContributors.refresh=true :app:generateGithubContributorsAsset

      - name: Assemble debug APK
        run: ./gradlew --stacktrace :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: duckdetector-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
